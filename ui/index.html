<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aurelia Launch</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<svg class="sprite" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></symbol>
  <symbol id="i-App" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="3.5"/></symbol>
  <symbol id="i-File" viewBox="0 0 24 24"><path d="M7 3.5h6.5L18 8v12.5H7z"/><path d="M13.5 3.5V8H18M9.5 13h6M9.5 16.5h4"/></symbol>
  <symbol id="i-Calc" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="3"/><path d="M8.5 7.5h7M9 12h.01M12 12h.01M15 12h.01M9 16h.01M12 16h.01M15 16h.01"/></symbol>
  <symbol id="i-WebSearch" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.8 5.2 3.8 8.5s-1.2 6.1-3.8 8.5c-2.6-2.4-3.8-5.2-3.8-8.5s1.2-6.1 3.8-8.5z"/></symbol>
  <symbol id="i-SystemCommand" viewBox="0 0 24 24"><path d="M12 3.5v7"/><path d="M7.2 6.6a7.5 7.5 0 1 0 9.6 0"/></symbol>
  <symbol id="i-brand" viewBox="0 0 24 24"><path d="m6.5 14.5 5.5-6 5.5 6"/><circle cx="12" cy="18.5" r=".6"/></symbol>
</svg>

<main id="panel">
  <header class="bar">
    <svg class="glyph" aria-hidden="true"><use href="#i-search"/></svg>
    <input id="q" type="text" placeholder="Search apps, calculate, or run a command…"
      autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
      role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list"
      aria-label="Search" autofocus />
    <kbd class="esc" id="escHint">esc</kbd>
  </header>

  <section class="body">
    <ul id="results" role="listbox" aria-label="Results" hidden></ul>

    <div id="home" class="state">
      <p class="state-title">Start typing to search</p>
      <ul class="tips">
        <li><button type="button" data-fill="Safari"><span>Safari</span><em>Open an app</em></button></li>
        <li><button type="button" data-fill="(12 + 8) * 3"><span>(12 + 8) * 3</span><em>Calculate</em></button></li>
        <li><button type="button" data-fill="g "><span>g <i>query</i></span><em>Search Google</em></button></li>
        <li><button type="button" data-fill="gh "><span>gh <i>query</i></span><em>Search GitHub</em></button></li>
        <li><button type="button" data-fill="yt "><span>yt <i>query</i></span><em>Search YouTube</em></button></li>
        <li><button type="button" data-fill="lock"><span>lock</span><em>System command</em></button></li>
      </ul>
    </div>

    <div id="none" class="state" hidden>
      <svg class="state-glyph" aria-hidden="true"><use href="#i-search"/></svg>
      <p class="state-title">No results for “<span id="noneQuery"></span>”</p>
      <p class="state-sub">Press <kbd>↵</kbd> to search the web instead</p>
    </div>
  </section>

  <footer class="foot">
    <span class="brand" id="status"><svg aria-hidden="true"><use href="#i-brand"/></svg><span id="statusText">Aurelia Launch</span></span>
    <span class="keys">
      <span class="key" id="actionHint"><span id="actionLabel">Open</span><kbd>↵</kbd></span>
      <span class="sep" aria-hidden="true"></span>
      <span class="key">Navigate<kbd>↑</kbd><kbd>↓</kbd></span>
    </span>
  </footer>
</main>
<script src="main.js"></script>
</body>
</html>
